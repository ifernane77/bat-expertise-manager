<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bat Expertise Manager - Clients</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header class="entete">
      <h1>BAT EXPERTISE</h1>
    </header>

    <div class="organisation">
      <nav class="menu">
        <ul>
          <li><a href="dashboard.html">Tableau de bord</a></li>
          <li><a href="clients.html">Clients</a></li>
          <li><a href="dossiers.html">Dossiers</a></li>
          <li><a href="devis.html">Devis</a></li>
          <li><a href="factures.html">Factures</a></li>
          <li><a href="materiel.html">Matériel</a></li>
        </ul>
      </nav>

      <main class="contenu">
        <h2>Gestion des clients</h2>
        <p>Liste des clients de Bat Expertise</p>

        <section>
          <h3>Clients enregistrés</h3>

          <button type="button" id="bouton-ajouter-client">
            Ajouter un client
          </button>

          <form id="formulaire-client" hidden>
            <h3>Nouveau client</h3>

            <p>
              <label for="nom-client">Nom :</label>
              <input type="text" id="nom-client" required />
            </p>

            <p>
              <label for="email-client">Email :</label>
              <input type="email" id="email-client" required />
            </p>

            <p>
              <label for="telephone-client">Téléphone :</label>
              <input type="tel" id="telephone-client" required />
            </p>

            <button type="submit">Enregistrer le client</button>
          </form>

          <p>
            <label for="recherche-client">Rechercher un client par nom :</label>
            <input
              type="search"
              id="recherche-client"
              placeholder="Exemple : Sophie"
            />
          </p>

          <table class="tableau">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Actions</th>
              </tr>
            </thead>

            <tbody id="liste-clients"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
